name: ci
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests -v
      - name: smoke-test the CLI
        run: |
          python3 -m cistep list -w examples/workflow.yml
          python3 -m cistep run -w examples/workflow.yml --only 1
